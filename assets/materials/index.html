<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>재료 아이콘 미리보기</title>
<style>*{box-sizing:border-box}body{margin:0;padding:40px;background:#10141b;color:#eef1f7;font-family:"Malgun Gothic",system-ui,sans-serif}main{max-width:1180px;margin:auto}h1{font-size:26px;margin:0 0 10px}p{color:#9ba6b7;font-size:14px;line-height:1.8}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:26px 0}button{font:inherit;cursor:pointer}.tools button{padding:10px 15px;border:1px solid #394354;border-radius:8px;background:#1b2330;color:#eef1f7}.tools button[aria-pressed=true]{border-color:#b7c7ff;color:#b7c7ff}.tools label{margin-left:auto;font-size:13px;color:#9ba6b7;display:flex;gap:10px;align-items:center}input{accent-color:#b7c7ff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}.item{display:grid;justify-items:center;gap:14px;align-content:start;padding:20px 10px;border:1px solid #29313e;border-radius:14px;background:#171e28;color:#eef1f7;font-size:13px}.art{width:var(--icon-size,112px);height:var(--icon-size,112px);display:block;max-width:100%;aspect-ratio:1}.art img{display:block;width:100%;height:100%;object-fit:contain}.item:hover{border-color:#b7c7ff}.light .art{background:#f4f5f8;border-radius:10px}.checker .art{background:repeating-conic-gradient(#e4e7ed 0 25%,#fff 0 50%) 0/16px 16px;border-radius:10px}button:focus-visible,input:focus-visible{outline:2px solid #b7c7ff;outline-offset:4px}[hidden]{display:none!important}dialog{width:min(720px,calc(100vw - 40px));padding:20px;border:1px solid #394354;border-radius:16px;color:#eef1f7;background:#171e28}dialog::backdrop{background:#000a}dialog header{display:flex;align-items:center;justify-content:space-between;gap:16px}dialog h2{margin:0;font-size:18px}dialog button{background:transparent;border:1px solid #394354;color:#eef1f7;border-radius:8px;padding:8px 14px}dialog img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}footer{margin-top:28px;font-size:13px;color:#9ba6b7}a{color:#b9dfff}@media(max-width:600px){body{padding:24px 16px}.tools label{margin-left:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head>
<body><main><h1>재료 아이콘</h1><p>경험치 재료 3종 · 각인석 10종 · 촉매 10종<br>모든 원본: 1254 × 1254 · 1:1 · 투명 PNG</p>
<div class="tools"><button type="button" data-filter="all" aria-pressed="true">전체 23</button><button type="button" data-filter="experience" aria-pressed="false">성장 재료</button><button type="button" data-filter="skill" aria-pressed="false">각인석</button><button type="button" data-filter="breakthrough" aria-pressed="false">촉매</button><button type="button" id="background">배경: 다크</button><label>표시 크기 <input id="size" type="range" min="48" max="144" value="112" step="16"><output id="size-value">112px</output></label></div>
<div class="grid"><button class="item" type="button" data-kind="experience" data-src="growth-shard.png" aria-label="성장의 조각 크게 보기"><span class="art"><img src="growth-shard.png" alt="성장의 조각" width="1254" height="1254"></span><span>성장의 조각</span></button>
<button class="item" type="button" data-kind="experience" data-src="growth-crystal.png" aria-label="성장의 결정 크게 보기"><span class="art"><img src="growth-crystal.png" alt="성장의 결정" width="1254" height="1254"></span><span>성장의 결정</span></button>
<button class="item" type="button" data-kind="experience" data-src="growth-essence.png" aria-label="성장의 정수 크게 보기"><span class="art"><img src="growth-essence.png" alt="성장의 정수" width="1254" height="1254"></span><span>성장의 정수</span></button>
<button class="item" type="button" data-kind="skill" data-src="inscription-fire.png" aria-label="화염 각인석 크게 보기"><span class="art"><img src="inscription-fire.png" alt="화염 각인석" width="1254" height="1254"></span><span>화염 각인석</span></button>
<button class="item" type="button" data-kind="skill" data-src="inscription-water.png" aria-label="물결 각인석 크게 보기"><span class="art"><img src="inscription-water.png" alt="물결 각인석" width="1254" height="1254"></span><span>물결 각인석</span></button>
<button class="item" type="button" data-kind="skill" data-src="inscription-wind.png" aria-label="바람 각인석 크게 보기"><span class="art"><img src="inscription-wind.png" alt="바람 각인석" width="1254" height="1254"></span><span>바람 각인석</span></button>
<button class="item" type="button" data-kind="skill" data-src="inscription-earth.png" aria-label="대지 각인석 크게 보기"><span class="art"><img src="inscription-earth.png" alt="대지 각인석" width="1254" height="1254"></span><span>대지 각인석</span></button>
<button class="item" type="button" data-kind="skill" data-src="inscription-lightning.png" aria-label="전격 각인석 크게 보기"><span class="art"><img src="inscription-lightning.png" alt="전격 각인석" width="1254" height="1254"></span><span>전격 각인석</span></button>
<button class="item" type="button" data-kind="skill" data-src="inscription-ice.png" aria-label="빙결 각인석 크게 보기"><span class="art"><img src="inscription-ice.png" alt="빙결 각인석" width="1254" height="1254"></span><span>빙결 각인석</span></button>
<button class="item" type="button" data-kind="skill" data-src="inscription-nature.png" aria-label="신록 각인석 크게 보기"><span class="art"><img src="inscription-nature.png" alt="신록 각인석" width="1254" height="1254"></span><span>신록 각인석</span></button>
<button class="item" type="button" data-kind="skill" data-src="inscription-light.png" aria-label="빛의 각인석 크게 보기"><span class="art"><img src="inscription-light.png" alt="빛의 각인석" width="1254" height="1254"></span><span>빛의 각인석</span></button>
<button class="item" type="button" data-kind="skill" data-src="inscription-dark.png" aria-label="어둠의 각인석 크게 보기"><span class="art"><img src="inscription-dark.png" alt="어둠의 각인석" width="1254" height="1254"></span><span>어둠의 각인석</span></button>
<button class="item" type="button" data-kind="skill" data-src="inscription-common.png" aria-label="공용 각인석 크게 보기"><span class="art"><img src="inscription-common.png" alt="공용 각인석" width="1254" height="1254"></span><span>공용 각인석</span></button>
<button class="item" type="button" data-kind="breakthrough" data-src="catalyst-fire.png" aria-label="화염 촉매 크게 보기"><span class="art"><img src="catalyst-fire.png" alt="화염 촉매" width="1254" height="1254"></span><span>화염 촉매</span></button>
<button class="item" type="button" data-kind="breakthrough" data-src="catalyst-water.png" aria-label="물결 촉매 크게 보기"><span class="art"><img src="catalyst-water.png" alt="물결 촉매" width="1254" height="1254"></span><span>물결 촉매</span></button>
<button class="item" type="button" data-kind="breakthrough" data-src="catalyst-wind.png" aria-label="바람 촉매 크게 보기"><span class="art"><img src="catalyst-wind.png" alt="바람 촉매" width="1254" height="1254"></span><span>바람 촉매</span></button>
<button class="item" type="button" data-kind="breakthrough" data-src="catalyst-earth.png" aria-label="대지 촉매 크게 보기"><span class="art"><img src="catalyst-earth.png" alt="대지 촉매" width="1254" height="1254"></span><span>대지 촉매</span></button>
<button class="item" type="button" data-kind="breakthrough" data-src="catalyst-lightning.png" aria-label="전격 촉매 크게 보기"><span class="art"><img src="catalyst-lightning.png" alt="전격 촉매" width="1254" height="1254"></span><span>전격 촉매</span></button>
<button class="item" type="button" data-kind="breakthrough" data-src="catalyst-ice.png" aria-label="빙결 촉매 크게 보기"><span class="art"><img src="catalyst-ice.png" alt="빙결 촉매" width="1254" height="1254"></span><span>빙결 촉매</span></button>
<button class="item" type="button" data-kind="breakthrough" data-src="catalyst-nature.png" aria-label="신록 촉매 크게 보기"><span class="art"><img src="catalyst-nature.png" alt="신록 촉매" width="1254" height="1254"></span><span>신록 촉매</span></button>
<button class="item" type="button" data-kind="breakthrough" data-src="catalyst-light.png" aria-label="빛의 촉매 크게 보기"><span class="art"><img src="catalyst-light.png" alt="빛의 촉매" width="1254" height="1254"></span><span>빛의 촉매</span></button>
<button class="item" type="button" data-kind="breakthrough" data-src="catalyst-dark.png" aria-label="어둠의 촉매 크게 보기"><span class="art"><img src="catalyst-dark.png" alt="어둠의 촉매" width="1254" height="1254"></span><span>어둠의 촉매</span></button>
<button class="item" type="button" data-kind="breakthrough" data-src="catalyst-common.png" aria-label="공용 촉매 크게 보기"><span class="art"><img src="catalyst-common.png" alt="공용 촉매" width="1254" height="1254"></span><span>공용 촉매</span></button></div><footer>아이콘을 누르면 크게 볼 수 있습니다. <a href="manifest.json">파일 목록</a> · <a href="generation-prompts.json">생성 프롬프트</a></footer></main>
<dialog id="viewer"><header><h2 id="name"></h2><button type="button" id="close">닫기</button></header><img id="full-image" alt=""></dialog>
<script>
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('.item').forEach(item=>item.hidden=button.dataset.filter!=='all'&&item.dataset.kind!==button.dataset.filter)}));
let background=0;document.getElementById('background').addEventListener('click',event=>{background=(background+1)%3;document.body.className=['','light','checker'][background];event.currentTarget.textContent='배경: '+['다크','라이트','투명 확인'][background]});
document.getElementById('size').addEventListener('input',event=>{document.documentElement.style.setProperty('--icon-size',event.target.value+'px');document.getElementById('size-value').textContent=event.target.value+'px'});
document.querySelectorAll('.item').forEach(item=>item.addEventListener('click',()=>{document.getElementById('name').textContent=item.querySelector('img').alt;const image=document.getElementById('full-image');image.src=item.dataset.src;image.alt=item.querySelector('img').alt;document.getElementById('viewer').showModal()}));document.getElementById('close').addEventListener('click',()=>document.getElementById('viewer').close());
</script></body></html>
