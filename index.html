<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>AI 가챠 게임</title>
    <style>
      /* 바깥 페이지 색상은 게임 테마와 별도로 관리합니다. */
      :root {
        color-scheme: light;
        --page-background: #f3f4f6;
        --page-padding: clamp(16px, 3vw, 48px);
        --frame-max-width: 1280px;
        --frame-height: 760px;
      }

      /* 새 테마는 이 변수 묶음에 대응하는 선택자를 추가하면 됩니다. */
      [data-theme="dark"] {
        color-scheme: dark;
        --surface-main: #131820;
        --surface-sidebar: #10141b;
        --surface-active: #242d3d;
        --surface-hover: #1b2330;
        --border: #29313e;
        --text-primary: #eef1f7;
        --text-secondary: #9ba6b7;
        --accent: #b7c7ff;
        --action-background: #b9dfff;
        --action-hover: #d0eaff;
        --action-text: #131820;
        --focus-ring: #b7c7ff;
        --success-background: #e1f5d5;
        --success-text: #20552d;
        --error-background: #ffe2eb;
        --error-text: #a71d3d;
        --frame-shadow: 0 20px 64px #1722341a, 0 3px 12px #1722340a;
      }

      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 280px;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: var(--page-padding);
        background: var(--page-background);
        font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .game-frame {
        width: min(100%, var(--frame-max-width));
        height: min(var(--frame-height), calc(100vh - var(--page-padding) * 2));
        height: min(var(--frame-height), calc(100dvh - var(--page-padding) * 2));
        min-height: 260px;
        display: grid;
        grid-template-columns: 104px minmax(0, 1fr);
        overflow: hidden;
        color: var(--text-primary);
        background: var(--surface-main);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--frame-shadow);
      }

      .sidebar {
        min-height: 0;
        overflow-y: auto;
        padding: 27px 12px;
        background: var(--surface-sidebar);
        border-right: 1px solid var(--border);
        scrollbar-width: thin;
      }
      .brand {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        margin: 0 auto 42px;
        color: var(--accent);
      }
      svg { display: block; width: 24px; height: 24px; }
      .brand svg { width: 32px; height: 32px; }
      .sidebar nav { display: grid; gap: 8px; }
      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 76px;
        padding: 12px 6px;
        border-radius: 12px;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }
      .nav-item:hover { background: var(--surface-hover); }
      .nav-item[aria-current="page"] {
        background: var(--surface-active);
        color: var(--accent);
      }
      .nav-item:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 3px;
      }

      .content {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      .content-header {
        flex-shrink: 0;
        padding: 35px 40px 29px;
        border-bottom: 1px solid var(--border);
      }
      h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.5px; }
      .content-header p {
        margin: 10px 0 0;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.7;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      .editor-footer {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 16px;
        padding: 18px 40px;
        border-top: 1px solid var(--border);
      }
      .save-connection-button {
        width: 152px; min-height: 46px; flex-shrink: 0;
        border: 1px solid var(--action-background); border-radius: 999px;
        background: var(--action-background); color: var(--action-text);
        font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      .save-connection-button:hover { background: var(--action-hover); }
      .save-connection-button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
      .save-connection-button:disabled { opacity: .65; cursor: wait; }
      .save-status { margin: 0; color: var(--text-secondary); font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
      .save-status[data-state="error"] { color: #ff9fb2; }
      #connection-list-status:not(:empty), #image-connection-list-status:not(:empty) { margin-bottom: 16px; }
      .saved-connections { display: grid; gap: 12px; }
      .saved-connection {
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; padding: 20px; border: 1px solid var(--border); border-radius: 14px;
      }
      .saved-connection div { min-width: 0; }
      .saved-connection strong { overflow-wrap: anywhere; }
      .saved-connection p { margin: 8px 0 0; color: var(--text-secondary); font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
      .saved-connection button {
        flex-shrink: 0; padding: 8px 14px; border: 1px solid var(--border);
        border-radius: 999px; background: var(--surface-active); color: var(--accent);
        font: inherit; font-size: 13px; cursor: pointer;
      }
      .saved-connection button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
      .content-body { flex: 1; min-height: 0; overflow-y: auto; padding: 32px 40px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
      .ai-toolbar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 152px)) minmax(0, 1fr) minmax(0, 152px);
        gap: 12px;
        align-items: start;
      }
      .ai-tabs {
        grid-column: 1 / 3;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        width: 100%;
      }
      .world-toolbar { display: flex; justify-content: flex-end; }
      .add-world-button { width: 152px; max-width: 100%; }
      .ai-tab, .add-ai-button, .add-world-button {
        min-width: 0;
        min-height: 46px;
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
        color: var(--text-secondary);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.5;
        cursor: pointer;
      }
      .add-ai-button { grid-column: 4; }
      .add-ai-button, .add-world-button {
        background: var(--action-background);
        border-color: var(--action-background);
        color: var(--action-text);
      }
      .add-ai-button:hover, .add-world-button:hover {
        background: var(--action-hover);
        border-color: var(--action-hover);
      }
      .ai-tab:hover { background: var(--surface-hover); }
      .ai-tab[aria-selected="true"] {
        background: var(--surface-active);
        border-color: var(--accent);
        color: var(--accent);
      }
      .ai-tab:focus-visible, .add-ai-button:focus-visible, .add-world-button:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 4px;
      }
      [hidden] { display: none !important; }
      .connection-back {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: transparent;
        color: var(--text-secondary);
        font: inherit;
        font-size: 16px;
        cursor: pointer;
      }
      .connection-back:hover { background: var(--surface-hover); color: var(--text-primary); }
      .connection-back:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 3px;
      }
      .connection-form {
        display: grid;
        gap: 30px;
        width: min(100%, 540px);
        margin: 24px auto 0;
        text-align: center;
      }
      .text-model-fields, .image-model-fields { display: grid; gap: 30px; min-width: 0; }
      .image-model-fields textarea.image-prompt-input { height: 104px; }
      .image-test-result { margin-top: 4px; }
      .image-thumbnail { display: block; width: min(100%, 240px); padding: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface-sidebar); cursor: zoom-in; }
      .image-thumbnail img { display: block; width: 100%; height: auto; }
      .image-thumbnail:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 4px; }
      .image-preview { width: 100vw; max-width: none; height: 100dvh; max-height: none; padding: 0; border: 0; background: #090d14f5; color: var(--text-primary, #eef1f7); }
      .image-preview::backdrop { background: #000b; }
      .image-preview-bar { position: absolute; top: 0; left: 0; right: 0; height: 64px; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #10141bf5; z-index: 1; }
      .image-preview-bar h2 { margin: 0; font-size: 15px; }
      .image-preview-close { border: 1px solid #566273; border-radius: 999px; background: #242d3d; color: #eef1f7; padding: 8px 18px; font: inherit; cursor: pointer; }
      .image-preview-scroll { position: absolute; inset: 64px 0 0; overflow: auto; }
      .image-preview-scroll img { display: block; width: 1024px; height: 1024px; max-width: none; margin: 24px auto; }
      .image-slider-row { display: grid; grid-template-columns: minmax(0, 1fr) 84px; align-items: center; gap: 18px; }
      .image-slider { width: 100%; min-width: 0; min-height: 32px; margin: 0; accent-color: var(--action-background); cursor: pointer; }
      .image-slider:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 4px; border-radius: 999px; }
      .image-slider-number { padding-inline: 8px; }
      .test-connection-button {
        width: 100%;
        min-height: 48px;
        padding: 12px 16px;
        border: 1px solid var(--action-background);
        border-radius: 12px;
        background: var(--action-background);
        color: var(--action-text);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .test-connection-button:disabled { cursor: wait; opacity: .65; }
      .connection-result {
        padding: 16px 18px;
        border-radius: 12px;
        text-align: left;
        font-size: 14px;
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      .connection-result p { margin: 6px 0 0; white-space: pre-wrap; }
      .connection-result[data-state="pending"] { background: var(--surface-active); color: var(--text-secondary); }
      .connection-result[data-state="success"] { background: var(--success-background); color: var(--success-text); }
      .connection-result[data-state="error"] { background: var(--error-background); color: var(--error-text); }
      .test-connection-button:hover { background: var(--action-hover); border-color: var(--action-hover); }
      .test-connection-button:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 3px;
      }
      .connection-field { display: grid; gap: 12px; min-width: 0; }
      .connection-field label, .connection-field-label { font-size: 14px; font-weight: 600; text-align: left; }
      .connection-field-hint { margin: 0; color: var(--text-secondary); font-size: 12px; line-height: 1.6; text-align: left; }
      .connection-input {
        width: 100%;
        min-width: 0;
        height: 48px;
        padding: 0 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface-sidebar);
        color: var(--text-primary);
        font: inherit;
        font-size: 14px;
        text-align: center;
      }
      textarea.connection-input {
        height: 136px;
        padding-block: 14px;
        resize: vertical;
        text-align: left;
        line-height: 1.6;
        font-family: ui-monospace, Consolas, monospace;
      }
      select.connection-input { cursor: pointer; text-align-last: center; }
      .connection-input:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 3px;
      }
      .ai-panel { margin-top: 28px; }
      .ai-panel[hidden] { display: none; }

      @media (max-width: 640px) {
        .game-frame { grid-template-columns: 76px minmax(0, 1fr); border-radius: 16px; }
        .sidebar { padding: 22px 8px; }
        .brand { margin-bottom: 30px; }
        .nav-item { font-size: 11px; gap: 8px; }
        .editor-footer { padding: 16px 22px; }
        .content-header { padding: 26px 22px 23px; }
        .content-body { padding: 24px 22px; }
        h1 { font-size: 20px; }
        .content-header p { font-size: 13px; }
        .ai-tabs { gap: 8px; }
        .ai-toolbar { gap: 8px; }
        .ai-tab, .add-ai-button, .add-world-button { padding-inline: 8px; font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <div class="game-frame" data-theme="dark">
      <aside class="sidebar" aria-label="게임 기본 설정">
        <div class="brand" role="img" aria-label="AI 가챠 게임">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path d="M16 3 19.5 12.5 29 16 19.5 19.5 16 29 12.5 19.5 3 16 12.5 12.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <circle cx="16" cy="16" r="3" fill="currentColor" />
          </svg>
        </div>
        <nav aria-label="설정 메뉴">
          <a class="nav-item" id="worlds-nav" href="#worlds">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <ellipse cx="12" cy="12" rx="4" ry="9" />
              <path d="M3 12h18M5 6.5h14M5 17.5h14" />
            </svg>
            <span>세계관</span>
          </a>
          <a class="nav-item" id="ai-connection-nav" href="#ai-connection" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="5" width="14" height="14" rx="4" />
              <path d="M9 1v4m6-4v4M9 19v4m6-4v4M1 9h4m-4 6h4m14-6h4m-4 6h4" />
              <rect x="9" y="9" width="6" height="6" rx="1" />
            </svg>
            <span>AI 연결</span>
          </a>
        </nav>
      </aside>
      <main class="content" id="ai-connection" aria-labelledby="page-title">
        <header class="content-header">
          <h1 id="page-title">AI 연결</h1>
          <p id="page-description">스토리를 만드는 AI와 이미지를 그리는 AI를 연결하세요.</p>
        </header>
        <div class="content-body" id="worlds" hidden>
          <div class="world-toolbar">
            <button class="add-world-button" type="button">+ 세계관 추가</button>
          </div>
        </div>
        <div class="content-body" id="ai-connection-body">
          <div id="connection-list-view">
          <div class="ai-toolbar">
          <div class="ai-tabs" role="tablist" aria-label="AI 종류">
            <button class="ai-tab" type="button" role="tab" id="text-ai-tab" aria-selected="true" aria-controls="text-ai-panel">텍스트 생성 AI</button>
            <button class="ai-tab" type="button" role="tab" id="image-ai-tab" aria-selected="false" aria-controls="image-ai-panel" tabindex="-1">이미지 생성 AI</button>
          </div>
          <button class="add-ai-button" type="button">+ AI 연결 추가</button>
          </div>
          <!-- 각 모델의 연결 설정은 해당 패널 안에 추가합니다. -->
          <section class="ai-panel" role="tabpanel" id="text-ai-panel" aria-labelledby="text-ai-tab" tabindex="0"><p class="save-status" id="connection-list-status" role="status"></p><div class="saved-connections" id="saved-connections"></div></section>
          <section class="ai-panel" role="tabpanel" id="image-ai-panel" aria-labelledby="image-ai-tab" tabindex="0" hidden><p class="save-status" id="image-connection-list-status" role="status"></p><div class="saved-connections" id="saved-image-connections"></div></section>
          </div>
          <div id="connection-editor-view" hidden>
            <button class="connection-back" id="connection-back" type="button" aria-label="뒤로가기" title="뒤로가기"><span aria-hidden="true">◀</span></button>
          <form class="connection-form" id="connection-form" aria-label="AI 연결 추가" autocomplete="off">
            <div class="connection-field">
              <label for="connection-model-type">연결할 모델</label>
              <select class="connection-input" id="connection-model-type" name="model-type">
                <option value="text">텍스트 모델</option>
                <option value="image">이미지 생성 모델</option>
              </select>
            </div>
            <div class="connection-field">
              <label id="connection-key-label" for="connection-vertex-key">API KEY</label>
              <textarea class="connection-input" id="connection-vertex-key" autocomplete="off" spellcheck="false" autocapitalize="none" aria-label="API KEY" placeholder="Google Vertex AI JSON 키 전체를 붙여넣으세요."></textarea>
              <input class="connection-input" type="password" id="connection-api-key" autocomplete="off" spellcheck="false" autocapitalize="none" aria-label="API KEY" hidden disabled />
            </div>
            <div class="text-model-fields" id="text-model-fields">
              <div class="connection-field">
                <label for="connection-name">이름</label>
                <input class="connection-input" type="text" id="connection-name" autocomplete="off" />
              </div>
              <div class="connection-field">
                <label for="connection-region">리전</label>
                <select class="connection-input" id="connection-region" name="region" aria-describedby="connection-region-hint">
                  <option value="global" selected>글로벌 (global)</option>
                  <option value="us-central1">미국 · 아이오와 (us-central1)</option>
                  <option value="asia-northeast3">한국 · 서울 (asia-northeast3)</option>
                  <option value="asia-northeast1">일본 · 도쿄 (asia-northeast1)</option>
                  <option value="europe-west4">유럽 · 네덜란드 (europe-west4)</option>
                </select>
                <p class="connection-field-hint" id="connection-region-hint">선택한 모델이 지원하는 리전을 선택하세요.</p>
              </div>
              <div class="connection-field">
                <label for="connection-model">모델</label>
                <input class="connection-input" type="text" id="connection-model" autocomplete="off" spellcheck="false" autocapitalize="none" />
              </div>
              <div class="connection-field">
                <span class="connection-field-label" id="connection-test-label">연결 테스트</span>
                <button class="test-connection-button" id="test-connection" type="button" aria-describedby="connection-test-label">테스트 메시지 전송</button>
                <div class="connection-result" id="connection-test-result" role="status" aria-live="polite" aria-atomic="true" hidden>
                  <strong id="connection-test-title"></strong>
                  <p id="connection-test-message"></p>
                </div>
              </div>
            </div>
            <div class="image-model-fields" id="image-model-fields" hidden>
              <div class="connection-field">
                <label for="connection-image-name">이름</label>
                <input class="connection-input" type="text" id="connection-image-name" autocomplete="off" maxlength="80" disabled />
              </div>
              <div class="connection-field">
                <label for="connection-image-model">모델</label>
                <select class="connection-input" id="connection-image-model" name="image-model" disabled>
                  <optgroup label="NovelAI Diffusion V5">
                    <option value="v5-full" selected>NovelAI Diffusion V5 Full</option>
                    <option value="v5-curated">NovelAI Diffusion V5 Curated</option>
                  </optgroup>
                  <optgroup label="NovelAI Diffusion V4.5">
                    <option value="v4-5-full">NovelAI Diffusion V4.5 Full</option>
                    <option value="v4-5-curated">NovelAI Diffusion V4.5 Curated</option>
                  </optgroup>
                  <optgroup label="NovelAI Diffusion V4">
                    <option value="v4-full">NovelAI Diffusion V4 Full</option>
                    <option value="v4-curated">NovelAI Diffusion V4 Curated</option>
                  </optgroup>
                  <optgroup label="NovelAI Diffusion V3">
                    <option value="anime-v3">NovelAI Diffusion Anime V3</option>
                    <option value="furry-v3">NovelAI Diffusion Furry V3</option>
                  </optgroup>
                </select>
              </div>
              <div class="connection-field">
                <label for="connection-image-prefix">프롬프트 접두사</label>
                <textarea class="connection-input image-prompt-input" id="connection-image-prefix" rows="3" spellcheck="false" disabled></textarea>
              </div>
              <div class="connection-field">
                <label for="connection-image-suffix">프롬프트 접미사</label>
                <textarea class="connection-input image-prompt-input" id="connection-image-suffix" rows="3" spellcheck="false" disabled></textarea>
              </div>
              <div class="connection-field">
                <label for="connection-image-negative-prefix">네거티브 접두사</label>
                <textarea class="connection-input image-prompt-input" id="connection-image-negative-prefix" rows="3" spellcheck="false" disabled></textarea>
              </div>
              <div class="connection-field">
                <label id="image-steps-label" for="image-steps-number">단계</label>
                <div class="image-slider-row" data-slider-pair>
                  <input class="image-slider" type="range" id="image-steps-range" min="1" max="50" step="1" value="28" aria-labelledby="image-steps-label" disabled />
                  <input class="connection-input image-slider-number" type="number" id="image-steps-number" min="1" max="50" step="1" value="28" aria-labelledby="image-steps-label" inputmode="numeric" disabled />
                </div>
              </div>
              <div class="connection-field">
                <label id="image-guidance-label" for="image-guidance-number">프롬프트 가이던스</label>
                <div class="image-slider-row" data-slider-pair>

                <p class="connection-field-hint" id="image-test-hint">1024 × 1024 이미지 1장을 생성합니다. 설정과 구독에 따라 Anlas가 사용될 수 있어요.</p>
                <div class="connection-result image-test-result" id="image-test-status" role="status" aria-live="polite" aria-atomic="true" hidden>
                  <strong id="image-test-title"></strong><p id="image-test-message"></p>
                </div>

          </form>
          </div>

          <p class="save-status" id="connection-save-status" role="status" aria-live="polite"></p>

    </div>
    <dialog class="image-preview" id="image-preview-dialog" aria-labelledby="image-preview-heading">
      <div class="image-preview-bar">
        <h2 id="image-preview-heading">테스트 이미지 · 1024 × 1024 원본 크기</h2>
        <button class="image-preview-close" id="image-preview-close" type="button">닫기</button>
      </div>
      <div class="image-preview-scroll" id="image-preview-scroll"><img id="image-preview-original" alt="테스트 이미지 원본" width="1024" height="1024" /></div>
    </dialog>
    <script>
      const connectionListView = document.getElementById('connection-list-view');
      const connectionEditor = document.getElementById('connection-editor-view');
      const connectionForm = document.getElementById('connection-form');
      const modelType = document.getElementById('connection-model-type');
      document.querySelectorAll('[data-slider-pair]').forEach(pair => {
        const slider = pair.querySelector('input[type="range"]');
        const number = pair.querySelector('input[type="number"]');
        slider.addEventListener('input', () => { number.value = slider.value; });
        number.addEventListener('input', () => {
          if (number.value !== '' && number.validity.valid) slider.value = number.value;
        });
        const normalizeNumber = () => {
          const min = Number(number.min);
          const max = Number(number.max);
          const step = Number(number.step);
          const parsed = number.valueAsNumber;
          const bounded = Number.isFinite(parsed) ? Math.max(min, Math.min(max, parsed)) : Number(slider.value);
          const rounded = Math.max(min, Math.min(max, Number((min + Math.round((bounded - min) / step) * step).toFixed(4))));
          slider.value = String(rounded);
          number.value = slider.value;
        };
        number.addEventListener('change', normalizeNumber);
        number.addEventListener('blur', normalizeNumber);
      });
      const imageCapabilities = {"v5-full":{"uc":["heavy","light","furry-focus","human-focus","none"],"quality":["standard","light","none"]},"v5-curated":{"uc":["heavy","light","furry-focus","human-focus","none"],"quality":["standard","light","none"]},"v4-5-full":{"uc":["heavy","light","furry-focus","human-focus","none"],"quality":["standard","none"]},"v4-5-curated":{"uc":["heavy","light","human-focus","none"],"quality":["standard","none"]},"v4-full":{"uc":["heavy","light","none"],"quality":["standard","none"]},"v4-curated":{"uc":["heavy","light","none"],"quality":["standard","none"]},"anime-v3":{"uc":["heavy","light","human-focus","none"],"quality":["standard","none"]},"furry-v3":{"uc":["heavy","light","none"],"quality":["standard","none"]}};
      function updateImagePresets() {
        const capabilities = imageCapabilities[document.getElementById('connection-image-model').value];
        for (const [id, supported] of [['image-uc-preset', capabilities.uc], ['image-quality-tags', capabilities.quality]]) {
          const select = document.getElementById(id);
          for (const option of select.options) option.disabled = !supported.includes(option.value);
          if (!supported.includes(select.value)) select.value = id === 'image-uc-preset' ? 'none' : 'standard';
        }
      }
      document.getElementById('connection-image-model').addEventListener('change', updateImagePresets);
      const imageTestButton = document.getElementById('test-image-connection');
      const imageStatus = document.getElementById('image-test-status');
      const imageThumbnail = document.getElementById('image-test-thumbnail');
      const imageResult = document.getElementById('image-test-image');
      const imageDialog = document.getElementById('image-preview-dialog');
      let pendingImageTest = null;
      let imageTestVersion = 0;
      function resetImageTest(clearImage = false) {
        imageTestVersion++;
        pendingImageTest?.abort();
        pendingImageTest = null;
        imageTestButton.disabled = modelType.value !== 'image';
        imageTestButton.textContent = '이미지 테스트';
        imageTestButton.setAttribute('aria-busy', 'false');
        imageStatus.hidden = true;
        if (clearImage) {
          imageThumbnail.hidden = true;
          imageResult.removeAttribute('src');
          document.getElementById('image-preview-original').removeAttribute('src');
          if (imageDialog.open) imageDialog.close();
        }
      }
      function imageStatusMessage(state, title, message) {
        imageStatus.dataset.state = state;
        document.getElementById('image-test-title').textContent = title;
        document.getElementById('image-test-message').textContent = message;
        imageStatus.hidden = false;
        requestAnimationFrame(() => { if (!imageStatus.hidden) imageStatus.scrollIntoView({block:'nearest'}); });
      }
      modelType.addEventListener('change', () => resetImageTest());
      imageThumbnail.addEventListener('click', () => {
        document.getElementById('image-preview-original').src = imageResult.src;
        imageDialog.showModal();
        document.getElementById('image-preview-scroll').scrollTo(0, 0);
      });
      document.getElementById('image-preview-close').addEventListener('click', () => imageDialog.close());
      imageTestButton.addEventListener('click', async () => {
        if (pendingImageTest || modelType.value !== 'image') return;
        const version = ++imageTestVersion;
        const token = document.getElementById('connection-api-key').value.trim();
        const body = { token, id: editingConnectionId, model: document.getElementById('connection-image-model').value, ...readImageSettings() };
        try {
          if (!token && !editingConnectionId) throw new Error('API KEY에 NovelAI Persistent API Token을 입력해 주세요.');
          if (location.protocol !== 'http:' || !['127.0.0.1','localhost'].includes(location.hostname)) throw new Error('이미지 테스트는 PC의 로컬 게임 주소에서 사용해 주세요.');
          const controller = new AbortController();
          pendingImageTest = controller;
          imageTestButton.disabled = true;
          imageTestButton.textContent = '이미지 생성 중…';
          imageTestButton.setAttribute('aria-busy', 'true');
          imageStatusMessage('pending','이미지 생성 중','선택한 설정으로 1024 × 1024 이미지 한 장을 요청하고 있어요.');
          const response = await fetch('/api/images/test', {
            method:'POST', cache:'no-store', headers:{'Content-Type':'application/json'},
            signal:AbortSignal.any([controller.signal,AbortSignal.timeout(185000)]),
            body:JSON.stringify(body),
          });
          let data;
          try { data = await response.json(); } catch { throw new Error('이미지 테스트 서버의 응답을 읽지 못했습니다. 로컬 서버를 다시 실행해 주세요.'); }
          if (version !== imageTestVersion) return;
          if (!response.ok || !data.ok) throw new Error(data.error?.message || '이미지 생성에 실패했습니다.');
          if (typeof data.image !== 'string' || !/^data:image\/png;base64,[A-Za-z0-9+/]+=*$/.test(data.image)) throw new Error('올바른 이미지 응답이 아닙니다.');
          const loaded = new Image();
          loaded.src = data.image;
          await loaded.decode();
          if (version !== imageTestVersion) return;
          if (loaded.naturalWidth !== 1024 || loaded.naturalHeight !== 1024) throw new Error('이미지 크기가 1024 × 1024가 아닙니다.');
          imageResult.src = data.image;
          imageThumbnail.hidden = false;
          imageStatusMessage('success','이미지 생성 성공','썸네일을 누르면 원본 크기로 볼 수 있어요.');
          requestAnimationFrame(() => imageThumbnail.scrollIntoView({block:'nearest'}));
        } catch (error) {
          if (version === imageTestVersion) imageStatusMessage('error','이미지 생성 실패',error.name === 'TimeoutError' ? '이미지 생성 시간이 초과됐습니다. 처리 여부를 확인한 후 다시 시도해 주세요.' : error instanceof TypeError ? '로컬 서버 또는 NovelAI 연결을 확인해 주세요.' : error.message || '이미지를 생성하지 못했습니다.');
        } finally {
          if (version === imageTestVersion) {
            pendingImageTest = null;
            imageTestButton.disabled = modelType.value !== 'image';
            imageTestButton.textContent = '이미지 테스트';
            imageTestButton.setAttribute('aria-busy', 'false');
          }
        }
      });
      let editingConnectionId = null;
      let savingConnection = false;
      let savedConnections = [];
      const editorFooter = document.getElementById('connection-editor-footer');
      const saveButton = document.getElementById('save-connection');
      const saveStatus = document.getElementById('connection-save-status');
      const textModelFields = document.getElementById('text-model-fields');
      function updateModelFields() {
        const isTextModel = modelType.value === 'text';
        textModelFields.hidden = !isTextModel;
        const imageModelFields = document.getElementById('image-model-fields');
        imageModelFields.hidden = isTextModel;
        imageModelFields.querySelectorAll('input, select, textarea, button').forEach(control => { control.disabled = isTextModel; });
        if (!isTextModel) updateImagePresets();
        imageTestButton.disabled = isTextModel || Boolean(pendingImageTest);
        editorFooter.hidden = connectionEditor.hidden;
        const vertexKey = document.getElementById('connection-vertex-key');
        const imageKey = document.getElementById('connection-api-key');
        vertexKey.hidden = !isTextModel;
        vertexKey.disabled = !isTextModel;
        imageKey.hidden = isTextModel;
        imageKey.disabled = isTextModel;
        document.getElementById('connection-key-label').htmlFor = isTextModel ? 'connection-vertex-key' : 'connection-api-key';
        textModelFields.querySelectorAll('input, select, button').forEach((control) => {
          control.disabled = !isTextModel;
        });
      }
      modelType.addEventListener('change', updateModelFields);
      const apiKey = document.getElementById('connection-api-key');
      document.querySelector('.add-ai-button').addEventListener('click', () => {
        resetImageTest(true);
        editingConnectionId = null;
        connectionForm.reset();
        saveStatus.textContent = '';
        document.getElementById('connection-vertex-key').placeholder = 'Google Vertex AI JSON 키 전체를 붙여넣으세요.';
        document.getElementById('connection-api-key').placeholder = 'NovelAI Persistent API Token';
        modelType.value = document.getElementById('image-ai-tab').getAttribute('aria-selected') === 'true' ? 'image' : 'text';
        updateModelFields();
        connectionListView.hidden = true;
        connectionEditor.hidden = false;
        updateModelFields();
        modelType.focus();
      });
      const testButton = document.getElementById('test-connection');
      const resultBox = document.getElementById('connection-test-result');
      const resultTitle = document.getElementById('connection-test-title');
      const resultMessage = document.getElementById('connection-test-message');
      let pendingTest = null;
      let testVersion = 0;
      function resetConnectionTest() {
        testVersion++;
        pendingTest?.abort();
        pendingTest = null;
        testButton.disabled = modelType.value !== 'text';
        testButton.textContent = '테스트 메시지 전송';
        testButton.setAttribute('aria-busy', 'false');
        resultBox.hidden = true;
        resultTitle.textContent = '';
        resultMessage.textContent = '';
      }
      function showConnectionResult(state, title, message) {
        resultBox.dataset.state = state;
        resultTitle.textContent = title;
        resultMessage.textContent = message;
        resultBox.hidden = false;
        requestAnimationFrame(() => { if (!resultBox.hidden) resultBox.scrollIntoView({ block: 'nearest' }); });
      }
      connectionForm.addEventListener('input', resetConnectionTest);
      connectionForm.addEventListener('change', resetConnectionTest);
      testButton.addEventListener('click', async () => {
        if (pendingTest || modelType.value !== 'text') return;
        resetConnectionTest();
        const version = testVersion;
        const credentials = document.getElementById('connection-vertex-key').value.trim();
        const model = document.getElementById('connection-model').value.trim();
        const region = document.getElementById('connection-region').value;
        try {
          if (!credentials && !editingConnectionId) throw new Error('API KEY에 Vertex AI 서비스 계정 JSON 키 전체를 입력해 주세요.');
          if (credentials) {
          let key;
          try { key = JSON.parse(credentials); }
          catch { throw new Error('API KEY의 JSON 형식이 올바르지 않습니다. 키 전체를 복사했는지 확인해 주세요.'); }
          if (!key || key.type !== 'service_account' || !key.project_id || !key.client_email || !key.private_key) {
            throw new Error('서비스 계정 JSON 키의 type, project_id, client_email, private_key를 확인해 주세요.');
          }
          }
          if (!model) throw new Error('호출할 모델 ID를 입력해 주세요.');
          if (location.protocol !== 'http:' || !['127.0.0.1', 'localhost'].includes(location.hostname)) {
            throw new Error('연결 테스트는 PC의 로컬 서버에서 실행해 주세요. 저장소 폴더에서 npm start를 실행한 뒤 표시되는 로컬 주소로 접속하면 됩니다.');
          }
          const controller = new AbortController();
          pendingTest = controller;
          testButton.disabled = true;
          testButton.textContent = '테스트 중…';
          testButton.setAttribute('aria-busy', 'true');
          showConnectionResult('pending', '연결 테스트 중', '모델에 hello를 보내고 응답을 기다리고 있어요.');
          let response;
          try {
            response = await fetch('/api/connections/test', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              cache: 'no-store',
              signal: AbortSignal.any([controller.signal, AbortSignal.timeout(65000)]),
              body: JSON.stringify({ credentials, model, region, id: editingConnectionId }),
            });
          } catch (error) {
            if (controller.signal.aborted) return;
            throw new Error(error.name === 'TimeoutError' ? '연결 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.' : '로컬 서버에 연결하지 못했습니다. 게임 서버가 실행 중인지 확인해 주세요.');
          }
          let data;
          try { data = await response.json(); }
          catch { throw new Error('연결 테스트 서버를 찾지 못했습니다. 화면 미리보기 서버 대신 npm start로 게임 서버를 실행해 주세요.'); }
          if (version !== testVersion) return;
          if (!response.ok || !data.ok) throw new Error(data.error?.message || '연결 테스트에 실패했습니다.');
          if (typeof data.text !== 'string' || !data.text.trim()) throw new Error('모델이 텍스트 응답을 반환하지 않았습니다.');
          showConnectionResult('success', '연결 성공', data.text);
        } catch (error) {
          if (version === testVersion) showConnectionResult('error', '연결 실패', error.message || '연결 테스트에 실패했습니다.');
        } finally {
          if (version === testVersion) {
            pendingTest = null;
            testButton.disabled = modelType.value !== 'text';
            testButton.textContent = '테스트 메시지 전송';
            testButton.setAttribute('aria-busy', 'false');
          }
        }
      });
      function readImageSettings() {
        return {
          prefix: document.getElementById('connection-image-prefix').value,
          suffix: document.getElementById('connection-image-suffix').value,
          negativePrefix: document.getElementById('connection-image-negative-prefix').value,
          steps: document.getElementById('image-steps-number').valueAsNumber,
          guidance: document.getElementById('image-guidance-number').valueAsNumber,
          rescale: document.getElementById('image-rescale-number').valueAsNumber,
          ucPreset: document.getElementById('image-uc-preset').value,
          qualityTags: document.getElementById('image-quality-tags').value,
        };
      }
      function restoreImageSettings(settings) {
        document.getElementById('connection-image-prefix').value = settings.prefix;
        document.getElementById('connection-image-suffix').value = settings.suffix;
        document.getElementById('connection-image-negative-prefix').value = settings.negativePrefix;
        for (const [key, id] of [['steps','steps'],['guidance','guidance'],['rescale','rescale']]) {
          document.getElementById('image-' + id + '-number').value = settings[key];
          document.getElementById('image-' + id + '-range').value = settings[key];
        }
        document.getElementById('image-uc-preset').value = settings.ucPreset;
        document.getElementById('image-quality-tags').value = settings.qualityTags;
      }
      async function loadSavedConnections() {
        const statuses = [document.getElementById('connection-list-status'), document.getElementById('image-connection-list-status')];
        if (location.protocol !== 'http:' || !['127.0.0.1', 'localhost'].includes(location.hostname)) return;
        try {
          const response = await fetch('/api/connections', { cache: 'no-store' });
          const data = await response.json();
          if (!response.ok || !data.ok || !Array.isArray(data.connections)) throw new Error(data.error?.message || '저장된 연결을 불러오지 못했습니다.');
          savedConnections = data.connections;
          const textList = document.getElementById('saved-connections');
          const imageList = document.getElementById('saved-image-connections');
          textList.replaceChildren(); imageList.replaceChildren();
          for (const connection of savedConnections) {
            const isImage = connection.provider === 'novelai';
            const card = document.createElement('article');
            card.className = 'saved-connection';
            const info = document.createElement('div');
            const title = document.createElement('strong');
            title.textContent = connection.name;
            const detail = document.createElement('p');
            const imageModelName = Array.from(document.getElementById('connection-image-model').options).find(option => option.value === connection.model)?.textContent;
            detail.textContent = isImage ? imageModelName || connection.model : connection.model + ' · ' + connection.region;
            info.append(title, detail);
            const edit = document.createElement('button');
            edit.type = 'button';
            edit.textContent = '수정';
            edit.setAttribute('aria-label', connection.name + ' 수정');
            edit.addEventListener('click', () => {
              resetConnectionTest(); resetImageTest(true);
              connectionForm.reset();
              editingConnectionId = connection.id;
              modelType.value = isImage ? 'image' : 'text';
              if (isImage) {
                document.getElementById('connection-image-name').value = connection.name;
                document.getElementById('connection-image-model').value = connection.model;
                restoreImageSettings(connection.settings);
                document.getElementById('connection-api-key').placeholder = '저장된 키를 사용합니다. 키를 바꿀 때만 새 토큰을 입력하세요.';
              } else {
                document.getElementById('connection-name').value = connection.name;
                document.getElementById('connection-model').value = connection.model;
                document.getElementById('connection-region').value = connection.region;
                document.getElementById('connection-vertex-key').placeholder = '저장된 JSON 키를 사용합니다. 키를 변경할 때만 새 JSON을 입력하세요.';
              }
              saveStatus.textContent = '';
              connectionListView.hidden = true;
              connectionEditor.hidden = false;
              updateModelFields();
              document.getElementById(isImage ? 'connection-image-name' : 'connection-name').focus();
            });
            card.append(info, edit);
            (isImage ? imageList : textList).append(card);
          }
          statuses.forEach(status => { status.textContent = ''; });
        } catch (error) {
          statuses.forEach(status => { status.textContent = error.message || '저장된 연결을 불러오지 못했습니다.'; });
        }
      }
      saveButton.addEventListener('click', async () => {
        if (savingConnection) return;
        const isImage = modelType.value === 'image';
        resetConnectionTest();
        resetImageTest();
        saveStatus.dataset.state = '';
        saveStatus.textContent = '';
        const name = document.getElementById(isImage ? 'connection-image-name' : 'connection-name').value.trim();
        const credentials = document.getElementById(isImage ? 'connection-api-key' : 'connection-vertex-key').value.trim();
        const model = document.getElementById(isImage ? 'connection-image-model' : 'connection-model').value.trim();
        const region = isImage ? undefined : document.getElementById('connection-region').value;
        const settings = isImage ? readImageSettings() : undefined;
        try {
          if (!name || name.length > 80) throw new Error('이름은 1~80자로 입력해 주세요.');
          if (!model) throw new Error('모델을 선택하거나 모델 ID를 입력해 주세요.');
          if (!credentials && !editingConnectionId) throw new Error('저장할 API KEY를 입력해 주세요.');
          if (location.protocol !== 'http:' || !['127.0.0.1', 'localhost'].includes(location.hostname)) throw new Error('연결 저장은 PC의 로컬 게임 주소에서 사용해 주세요.');
          savingConnection = true;
          connectionForm.inert = true;
          document.getElementById('connection-back').disabled = true;
          saveButton.disabled = true;
          saveButton.textContent = '저장 중…';
          const response = await fetch('/api/connections', {
            method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: editingConnectionId, provider: isImage ? 'novelai' : 'vertex', name, credentials, model, region, settings }),
          });
          let data;
          try { data = await response.json(); } catch { throw new Error('로컬 저장 서버를 찾지 못했습니다. 게임 서버를 다시 실행해 주세요.'); }
          if (!response.ok || !data.ok) throw new Error(data.error?.message || '연결을 저장하지 못했습니다.');
          savingConnection = false;
          returnToConnectionList();
          selectTab(document.getElementById(isImage ? 'image-ai-tab' : 'text-ai-tab'));
          await loadSavedConnections();
          document.getElementById(isImage ? 'image-connection-list-status' : 'connection-list-status').textContent = name + ' 연결을 이 PC에 저장했어요.';
        } catch (error) {
          saveStatus.dataset.state = 'error';
          saveStatus.textContent = error.message || '저장하지 못했습니다. 로컬 서버 연결을 확인해 주세요.';
        } finally {
          savingConnection = false;
          connectionForm.inert = false;
          document.getElementById('connection-back').disabled = false;
          saveButton.disabled = false;
          saveButton.textContent = '저장';
        }
      });
      loadSavedConnections();
      connectionForm.addEventListener('submit', (event) => event.preventDefault());
      function returnToConnectionList() {
        if (connectionEditor.hidden || savingConnection) return;
        resetConnectionTest();
        resetImageTest(true);
        connectionForm.reset();
        updateModelFields();
        apiKey.value = '';
        connectionEditor.hidden = true;
        editorFooter.hidden = true;
        editingConnectionId = null;
        connectionListView.hidden = false;
        document.querySelector('.add-ai-button').focus();
      }
      document.getElementById('connection-back').addEventListener('click', returnToConnectionList);
      const worldNav = document.getElementById('worlds-nav');
      const aiNav = document.getElementById('ai-connection-nav');
      function showSection(section) {
        if (savingConnection) return;
        returnToConnectionList();
        const isWorlds = section === 'worlds';
        document.getElementById('worlds').hidden = !isWorlds;
        document.getElementById('ai-connection-body').hidden = isWorlds;
        editorFooter.hidden = true;
        document.getElementById('page-title').textContent = isWorlds ? '세계관' : 'AI 연결';
        document.getElementById('page-description').textContent = isWorlds
          ? '나만의 세계관을 만들고, 이어서 플레이하세요.'
          : '스토리를 만드는 AI와 이미지를 그리는 AI를 연결하세요.';
        for (const [link, selected] of [[worldNav, isWorlds], [aiNav, !isWorlds]]) {
          if (selected) link.setAttribute('aria-current', 'page');
          else link.removeAttribute('aria-current');
        }
      }
      for (const [link, section] of [[worldNav, 'worlds'], [aiNav, 'ai-connection']]) {
        link.addEventListener('click', event => {
          event.preventDefault();
          if (savingConnection) return;
          showSection(section);
          history.replaceState(null, '', '#' + section);
        });
      }
      window.addEventListener('hashchange', () => showSection(location.hash === '#worlds' ? 'worlds' : 'ai-connection'));
      showSection(location.hash === '#worlds' ? 'worlds' : 'ai-connection');
      const tabs = Array.from(document.querySelectorAll('.ai-tab'));
      function selectTab(selectedTab) {
        tabs.forEach((tab) => {
          const isSelected = tab === selectedTab;
          tab.setAttribute('aria-selected', String(isSelected));
          tab.tabIndex = isSelected ? 0 : -1;
          document.getElementById(tab.getAttribute('aria-controls')).hidden = !isSelected;
        });
      }
      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => selectTab(tab));
        tab.addEventListener('keydown', (event) => {
          let nextIndex;
          if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
          else if (event.key === 'ArrowLeft') nextIndex = (index - 1 + tabs.length) % tabs.length;
          else if (event.key === 'Home') nextIndex = 0;
          else if (event.key === 'End') nextIndex = tabs.length - 1;
          else return;
          event.preventDefault();
          selectTab(tabs[nextIndex]);
          tabs[nextIndex].focus();
        });
      });
    </script>
  </body>
</html>
