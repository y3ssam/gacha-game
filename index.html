<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>AI 가챠 게임</title>
    <style>
      /* 바깥 페이지 색상은 게임 테마와 별도로 관리합니다. */
      :root {
        color-scheme: light;
        --page-background: #f3f4f6;
        --page-padding: clamp(16px, 3vw, 48px);
        --frame-max-width: 1280px;
        --frame-height: 760px;
      }

      /* 새 테마는 이 변수 묶음에 대응하는 선택자를 추가하면 됩니다. */
      [data-theme="dark"] {
        color-scheme: dark;
        --surface-main: #131820;
        --surface-sidebar: #10141b;
        --surface-active: #242d3d;
        --surface-hover: #1b2330;
        --border: #29313e;
        --text-primary: #eef1f7;
        --text-secondary: #9ba6b7;
        --accent: #b7c7ff;
        --action-background: #b9dfff;
        --action-hover: #d0eaff;
        --action-text: #131820;
        --focus-ring: #b7c7ff;
        --frame-shadow: 0 20px 64px #1722341a, 0 3px 12px #1722340a;
      }

      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 280px;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: var(--page-padding);
        background: var(--page-background);
        font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .game-frame {
        width: min(100%, var(--frame-max-width));
        height: min(var(--frame-height), calc(100vh - var(--page-padding) * 2));
        height: min(var(--frame-height), calc(100dvh - var(--page-padding) * 2));
        min-height: 260px;
        display: grid;
        grid-template-columns: 104px minmax(0, 1fr);
        overflow: hidden;
        color: var(--text-primary);
        background: var(--surface-main);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--frame-shadow);
      }

      .sidebar {
        min-height: 0;
        overflow-y: auto;
        padding: 27px 12px;
        background: var(--surface-sidebar);
        border-right: 1px solid var(--border);
        scrollbar-width: thin;
      }
      .brand {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        margin: 0 auto 42px;
        color: var(--accent);
      }
      svg { display: block; width: 24px; height: 24px; }
      .brand svg { width: 32px; height: 32px; }
      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 76px;
        padding: 12px 6px;
        border-radius: 12px;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }
      .nav-item:hover { background: var(--surface-hover); }
      .nav-item[aria-current="page"] {
        background: var(--surface-active);
        color: var(--accent);
      }
      .nav-item:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 3px;
      }

      .content {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      .content-header {
        padding: 35px 40px 29px;
        border-bottom: 1px solid var(--border);
      }
      h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.5px; }
      .content-header p {
        margin: 10px 0 0;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.7;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      .content-body { flex: 1; padding: 32px 40px; }
      .ai-toolbar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 152px)) minmax(0, 1fr) minmax(0, 152px);
        gap: 12px;
        align-items: start;
      }
      .ai-tabs {
        grid-column: 1 / 3;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        width: 100%;
      }
      .ai-tab, .add-ai-button {
        min-width: 0;
        min-height: 46px;
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
        color: var(--text-secondary);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.5;
        cursor: pointer;
      }
      .add-ai-button {
        grid-column: 4;
        background: var(--action-background);
        border-color: var(--action-background);
        color: var(--action-text);
      }
      .add-ai-button:hover {
        background: var(--action-hover);
        border-color: var(--action-hover);
      }
      .ai-tab:hover { background: var(--surface-hover); }
      .ai-tab[aria-selected="true"] {
        background: var(--surface-active);
        border-color: var(--accent);
        color: var(--accent);
      }
      .ai-tab:focus-visible, .add-ai-button:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 4px;
      }
      [hidden] { display: none !important; }
      .connection-back {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: transparent;
        color: var(--text-secondary);
        font: inherit;
        font-size: 16px;
        cursor: pointer;
      }
      .connection-back:hover { background: var(--surface-hover); color: var(--text-primary); }
      .connection-back:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 3px;
      }
      .connection-form {
        display: grid;
        gap: 30px;
        width: min(100%, 540px);
        margin: 24px auto 0;
        text-align: center;
      }
      .connection-field { display: grid; gap: 12px; min-width: 0; }
      .connection-field label { font-size: 14px; font-weight: 600; text-align: left; }
      .connection-input {
        width: 100%;
        min-width: 0;
        height: 48px;
        padding: 0 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface-sidebar);
        color: var(--text-primary);
        font: inherit;
        font-size: 14px;
        text-align: center;
      }
      select.connection-input { cursor: pointer; text-align-last: center; }
      .connection-input:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 3px;
      }
      .ai-panel { margin-top: 28px; }
      .ai-panel[hidden] { display: none; }

      @media (max-width: 640px) {
        .game-frame { grid-template-columns: 76px minmax(0, 1fr); border-radius: 16px; }
        .sidebar { padding: 22px 8px; }
        .brand { margin-bottom: 30px; }
        .nav-item { font-size: 11px; gap: 8px; }
        .content-header { padding: 26px 22px 23px; }
        .content-body { padding: 24px 22px; }
        h1 { font-size: 20px; }
        .content-header p { font-size: 13px; }
        .ai-tabs { gap: 8px; }
        .ai-toolbar { gap: 8px; }
        .ai-tab, .add-ai-button { padding-inline: 8px; font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <div class="game-frame" data-theme="dark">
      <aside class="sidebar" aria-label="게임 기본 설정">
        <div class="brand" role="img" aria-label="AI 가챠 게임">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path d="M16 3 19.5 12.5 29 16 19.5 19.5 16 29 12.5 19.5 3 16 12.5 12.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <circle cx="16" cy="16" r="3" fill="currentColor" />
          </svg>
        </div>
        <nav aria-label="설정 메뉴">
          <a class="nav-item" href="#ai-connection" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="5" width="14" height="14" rx="4" />
              <path d="M9 1v4m6-4v4M9 19v4m6-4v4M1 9h4m-4 6h4m14-6h4m-4 6h4" />
              <rect x="9" y="9" width="6" height="6" rx="1" />
            </svg>
            <span>AI 연결</span>
          </a>
        </nav>
      </aside>
      <main class="content" id="ai-connection" aria-labelledby="page-title">
        <header class="content-header">
          <h1 id="page-title">AI 연결</h1>
          <p>스토리를 만드는 AI와 이미지를 그리는 AI를 연결하세요.</p>
        </header>
        <div class="content-body">
          <div id="connection-list-view">
          <div class="ai-toolbar">
          <div class="ai-tabs" role="tablist" aria-label="AI 종류">
            <button class="ai-tab" type="button" role="tab" id="text-ai-tab" aria-selected="true" aria-controls="text-ai-panel">텍스트 생성 AI</button>
            <button class="ai-tab" type="button" role="tab" id="image-ai-tab" aria-selected="false" aria-controls="image-ai-panel" tabindex="-1">이미지 생성 AI</button>
          </div>
          <button class="add-ai-button" type="button">+ AI 연결 추가</button>
          </div>
          <!-- 각 모델의 연결 설정은 해당 패널 안에 추가합니다. -->
          <section class="ai-panel" role="tabpanel" id="text-ai-panel" aria-labelledby="text-ai-tab" tabindex="0"></section>
          <section class="ai-panel" role="tabpanel" id="image-ai-panel" aria-labelledby="image-ai-tab" tabindex="0" hidden></section>
          </div>
          <div id="connection-editor-view" hidden>
            <button class="connection-back" id="connection-back" type="button" aria-label="뒤로가기" title="뒤로가기"><span aria-hidden="true">◀</span></button>
          <form class="connection-form" id="connection-form" aria-label="AI 연결 추가" autocomplete="off">
            <div class="connection-field">
              <label for="connection-model-type">연결할 모델</label>
              <select class="connection-input" id="connection-model-type" name="model-type">
                <option value="text">텍스트 모델</option>
                <option value="image">이미지 생성 모델</option>
              </select>
            </div>
            <div class="connection-field">
              <label for="connection-api-key">API KEY</label>
              <input class="connection-input" type="password" id="connection-api-key" autocomplete="off" spellcheck="false" autocapitalize="none" aria-label="API KEY" />
            </div>
          </form>
          </div>
        </div>
      </main>
    </div>
    <script>
      const connectionListView = document.getElementById('connection-list-view');
      const connectionEditor = document.getElementById('connection-editor-view');
      const connectionForm = document.getElementById('connection-form');
      const modelType = document.getElementById('connection-model-type');
      const apiKey = document.getElementById('connection-api-key');
      document.querySelector('.add-ai-button').addEventListener('click', () => {
        modelType.value = document.getElementById('image-ai-tab').getAttribute('aria-selected') === 'true' ? 'image' : 'text';
        connectionListView.hidden = true;
        connectionEditor.hidden = false;
        modelType.focus();
      });
      // 입력 화면만 구현한 단계이므로 키를 저장하거나 전송하지 않습니다.
      connectionForm.addEventListener('submit', (event) => event.preventDefault());
      function returnToConnectionList() {
        if (connectionEditor.hidden) return;
        connectionForm.reset();
        apiKey.value = '';
        connectionEditor.hidden = true;
        connectionListView.hidden = false;
        document.querySelector('.add-ai-button').focus();
      }
      document.getElementById('connection-back').addEventListener('click', returnToConnectionList);
      document.querySelector('.nav-item').addEventListener('click', returnToConnectionList);
      const tabs = Array.from(document.querySelectorAll('.ai-tab'));
      function selectTab(selectedTab) {
        tabs.forEach((tab) => {
          const isSelected = tab === selectedTab;
          tab.setAttribute('aria-selected', String(isSelected));
          tab.tabIndex = isSelected ? 0 : -1;
          document.getElementById(tab.getAttribute('aria-controls')).hidden = !isSelected;
        });
      }
      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => selectTab(tab));
        tab.addEventListener('keydown', (event) => {
          let nextIndex;
          if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
          else if (event.key === 'ArrowLeft') nextIndex = (index - 1 + tabs.length) % tabs.length;
          else if (event.key === 'Home') nextIndex = 0;
          else if (event.key === 'End') nextIndex = tabs.length - 1;
          else return;
          event.preventDefault();
          selectTab(tabs[nextIndex]);
          tabs[nextIndex].focus();
        });
      });
    </script>
  </body>
</html>
